<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Assignment.</title>
<style>
  html { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    color: #0f172a;
    font-family: ui-sans-serif, system-ui, sans-serif;
    padding: 24px;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0a0f1c; color: #f1f5f9; }
  }
  .card { max-width: 360px; }
  .icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: #4f46e5; color: #fff; display: flex;
    align-items: center; justify-content: center; margin: 0 auto 20px;
    font-weight: 700; font-size: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #64748b; margin: 0; line-height: 1.5; }
  button {
    margin-top: 20px; padding: 10px 20px; border-radius: 10px; border: none;
    background: #4f46e5; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">A.</div>
    <h1>You're offline</h1>
    <p>Assignment. needs a connection to load this page. Anything already open should still work — reconnect to keep going.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
